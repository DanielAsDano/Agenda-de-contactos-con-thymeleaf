<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/header::header-seccion(titulo='Editar')}">
</head>

<body>
<!--  NAVBAR  -->
<div th:replace="~{common/navbar::navbar-section}"/>

<!--  CONTENT  -->
<div class="container" style="flex: 1 0 auto; display: flex; align-items: center; justify-content: center; padding: 2rem 0;">
    <div style="width: 100%; max-width: 480px; margin: 0 auto;">
        <div class="card-custom">
            <h4 class="mb-4 text-center" style="font-weight: 700; letter-spacing: -0.02em;">Editar Contacto</h4>
            
            <form action="/editar" th:object="${contacto}" method="post">
                <input type="hidden" th:field="*{idContacto}">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control-custom" id="nombre" name="nombre" required th:field="*{nombre}" placeholder="Nombre completo">
                </div>
                <div class="mb-3">
                    <label for="celular" class="form-label">Celular</label>
                    <input type="text" class="form-control-custom" id="celular" name="celular" th:field="*{celular}" placeholder="Número de celular">
                </div>
                <div class="mb-4">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control-custom" id="email" name="email" th:field="*{email}" placeholder="correo@ejemplo.com">
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="/" class="btn-custom btn-custom-secondary">Regresar</a>
                    <button type="submit" class="btn-custom btn-custom-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{common/footer::footer-section}"/>

</body>
</html>
