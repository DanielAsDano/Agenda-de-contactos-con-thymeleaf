<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/header::header-seccion(titulo='Inicio')}">
</head>

<body>
<!--  NAVBAR  -->
<div th:replace="~{common/navbar::navbar-section}"/>
<!--  TABLE  -->
<div class="container">
    <div class="container text-center" style="margin:30px">
        <h3>CONTACTOS</h3>
    </div>

    <div class="container">
        <table class="table table-striped table-hover align-middle table-bordered">
            <thead class="table-dark text-center">
            <tr>
                <th scope="col">Id</th>
                <th scope="col">Nombre</th>
                <th scope="col">Celular</th>
                <th scope="col">Email</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="contacto: ${contactos}">
                <th th:text="${contacto.idContacto}" scope="row"></th>
                <td th:text="${contacto.nombre}"></td>
                <td th:text="${contacto.celular}"></td>
                <td th:text="${contacto.email}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{common/footer::footer-section}"/>


</body>
</html>
