<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/header::header-seccion(titulo='Inicio')}">
</head>

<body>
<!--  NAVBAR  -->
<div th:replace="~{common/navbar::navbar-section}"/>

<!--  CONTENT  -->
<div class="container">
    <div class="section-header text-center">
        <h3>CONTACTOS</h3>
        <p class="text-muted-custom">Gestiona, visualiza y organiza tus contactos profesionales</p>
    </div>

    <div class="table-container">
        <table class="table-custom align-middle">
            <thead>
            <tr>
                <th scope="col" style="width: 8%; text-align: center;">Id</th>
                <th scope="col" style="width: 32%;">Nombre</th>
                <th scope="col" style="width: 20%;">Celular</th>
                <th scope="col" style="width: 25%;">Email</th>
                <th scope="col" style="width: 15%; text-align: center;">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="contacto: ${contactos}">
                <td th:text="${contacto.idContacto}" style="text-align: center; font-weight: 600; color: var(--text-secondary);"></td>
                <td th:text="${contacto.nombre}" style="font-weight: 500;"></td>
                <td th:text="${contacto.celular}"></td>
                <td th:text="${contacto.email}"></td>
                <td style="text-align: center;">
                    <div class="d-flex justify-content-center align-items-center gap-2">
                        <a th:href="@{/editar/{id}(id=${contacto.idContacto})}" class="btn-custom btn-custom-warning btn-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 3px; vertical-align: text-bottom;">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                            Editar
                        </a>
                        <form th:action="@{/eliminar/{id}(id=${contacto.idContacto})}" method="post" style="display:inline; margin: 0;">
                            <button type="submit" class="btn-custom btn-custom-danger btn-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 3px; vertical-align: text-bottom;">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                                Eliminar
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{common/footer::footer-section}"/>

</body>
</html>
